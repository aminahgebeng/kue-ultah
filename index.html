<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <!-- Stiker Karakter We Bare Bears -->
    <div class="bear-sticker bear-grizz" title="Grizzly">
      <div class="bear-face grizz-face">
        <div class="ear left"></div><div class="ear right"></div>
        <div class="eye left"></div><div class="eye right"></div>
        <div class="snout"><div class="nose"></div></div>
      </div>
    </div>

    <div class="bear-sticker bear-panda" title="Panda">
      <div class="bear-face panda-face">
        <div class="ear left"></div><div class="ear right"></div>
        <div class="eye-patch left"><div class="eye"></div></div>
        <div class="eye-patch right"><div class="eye"></div></div>
        <div class="snout"><div class="nose"></div></div>
      </div>
    </div>

    <div class="bear-sticker bear-ice" title="Ice Bear">
      <div class="bear-face ice-face">
        <div class="ear left"></div><div class="ear right"></div>
        <div class="eye left"></div><div class="eye right"></div>
        <div class="snout"><div class="nose"></div></div>
      </div>
    </div>

    <h1 class="title">HAPPY BIRTHDAY! 🎉</h1>
    
    <!-- Kue Virtual 3 Tingkat (Blue Navy, Gold Egg, Merah Delima) -->
    <div class="cake-container">
      <svg class="cake-svg" viewBox="0 0 200 200">
        <!-- Piring Kue -->
        <ellipse cx="100" cy="180" rx="85" ry="12" fill="#334155" />

        <!-- Tingkat 1 (Bawah - Blue Navy) -->
        <path d="M 30,130 L 30,175 Q 100,190 170,175 L 170,130 Z" fill="#0f172a" />
        <path d="M 30,130 Q 100,142 170,130 Q 170,125 100,120 Q 30,125 30,130 Z" fill="#1e293b" />
        <!-- Pita/Aksen Gold Egg di Tingkat Bawah -->
        <path d="M 30,165 Q 100,180 170,165 L 170,170 Q 100,185 30,170 Z" fill="#ffb703" />

        <!-- Tingkat 2 (Tengah - Kuning Gold Egg) -->
        <path d="M 45,85 L 45,125 Q 100,137 155,125 L 155,85 Z" fill="#ffb703" />
        <path d="M 45,85 Q 100,95 155,85 Q 155,80 100,75 Q 45,80 45,85 Z" fill="#ffc300" />
        <!-- Drip / Lelehan Merah Delima di Tingkat Tengah -->
        <path d="M 45,85 Q 55,100 65,85 Q 80,105 95,85 Q 110,102 125,85 Q 140,100 155,85 Q 155,80 100,75 Q 45,80 45,85 Z" fill="#9e2a2b" />

        <!-- Tingkat 3 (Atas - Merah Delima / Ruby) -->
        <path d="M 60,45 L 60,80 Q 100,90 140,80 L 140,45 Z" fill="#9e2a2b" />
        <path d="M 60,45 Q 100,53 140,45 Q 140,40 100,35 Q 60,40 60,45 Z" fill="#b01c2e" />
        <!-- Krim Lelehan Gold Egg Atas -->
        <path d="M 60,45 Q 75,55 85,45 Q 100,58 115,45 Q 125,54 140,45 Q 60,40 60,45 Z" fill="#ffb703" />

        <!-- Top Topping: Buah Ceri Merah Delima di Puncak -->
        <circle cx="100" cy="30" r="9" fill="#b01c2e" />
        <circle cx="97" cy="27" r="2.5" fill="#ffffff" opacity="0.6" />
        <path d="M 100,21 Q 108,12 114,8" stroke="#15803d" stroke-width="2" fill="none" />
      </svg>
    </div>

    <!-- Teks Ucapan (Bahasa Inggris) -->
    <p class="wish-title">Wish You All The Best!</p>
    <p class="wish-text">Always be happy and may all your dreams come true soon!</p>
    
    <button id="playBtn">▶️ Putar Lagu</button>
  </div>

  <audio id="hbdAudio" src="ultah.mp3"></audio>
  <script src="script.js"></script>
</body>
</html>
